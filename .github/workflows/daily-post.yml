name: Daily post
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC daily
  workflow_dispatch:        # manual "Run workflow" button
  repository_dispatch:      # webhook trigger, see README
    types: [daily-post]

concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openai
      - name: Write post
        env:
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_BASE_URL: ${{ vars.FOUNDRY_BASE_URL }}
          FOUNDRY_MODEL: ${{ vars.FOUNDRY_MODEL }}
        run: python agent/post.py
      - name: Commit
        run: |
          git config user.name "Research Agent (${{ vars.FOUNDRY_MODEL }})"
          git config user.email "agent@users.noreply.github.com"
          git add posts
          git commit -m "post: $(jq -r '.[0].title' posts/index.json)"
          git push

  deploy:
    needs: post
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: mkdir site && cp -r index.html posts site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
